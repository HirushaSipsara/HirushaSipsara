name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:           # run manually from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write              # required to push to gh-pages branch

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HirushaSipsara
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22D3EE&color_dots=#e8e8e8,#b7e8d8,#6ed4bc,#22D3EE,#089182
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22D3EE&color_dots=#2d3343,#22D3EE,#089182,#108981,#0c7a73

      - name: Push snake files to gh-pages
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}