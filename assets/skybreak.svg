<svg xmlns="http://www.w3.org/2000/svg" width="560" height="172" viewBox="0 0 560 172" role="img" aria-label="skybreak.svg">
<title>skybreak.svg</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#233145" stroke-width="0.6"/></pattern><linearGradient id="edge"><stop stop-color="#5ee7f7"/><stop offset="1" stop-color="#c5f277"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.flow{stroke-dasharray:8 18;animation:flow 5s linear infinite}.orbit{transform-origin:960px 220px;animation:orbit 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.3s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.signal{animation:signal 6s linear infinite}.rail{stroke-dasharray:32 1080;animation:rail 8s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.reverse-orbit{transform-origin:960px 220px;animation:orbit 23s linear infinite reverse}.meter{transform-box:fill-box;transform-origin:center bottom;animation:meter 2.4s ease-in-out infinite alternate}
@keyframes signal{from{transform:translateX(0)}to{transform:translateX(520px)}}
@keyframes rail{to{stroke-dashoffset:-1112}}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes meter{from{transform:scaleY(.28)}to{transform:scaleY(1)}}
.card-track{animation:cardtrack 7.0s linear infinite}@keyframes cardtrack{to{stroke-dashoffset:-584}}</style>
<rect width="560" height="172" rx="20" fill="#0b111b"/><rect x="1" y="1" width="558" height="170" rx="19" fill="none" stroke="#29374a"/><path d="M20 1H540" stroke="#ffb77a" stroke-width="3"/><text x="25" y="38" fill="#ffb77a" class="mono" font-size="12" letter-spacing="1.4">GAMEPLAY &amp; INTELLIGENT SYSTEMS</text><text x="25" y="88" fill="#f1f5f9" font-size="32" font-weight="650" letter-spacing="-.8">Skybreak</text><text x="25" y="136" fill="#99aabe" class="mono" font-size="14">Unity · C# · Agent behaviour</text><text x="535" y="47" text-anchor="end" fill="#516477" class="mono" font-size="20">06</text><path d="M20 158H540" stroke="#273848" stroke-width="2"/><path d="M20 158H540" stroke="#ffb77a" stroke-width="2" stroke-dasharray="24 560" class="card-track" style="animation-delay:-4.25s"/><circle cx="534" cy="136" r="3" fill="#ffb77a" class="breathe" style="animation-delay:-4.25s"/></svg>