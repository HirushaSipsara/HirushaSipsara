<svg xmlns="http://www.w3.org/2000/svg" width="600" height="235" viewBox="0 0 600 235"><title>Engineering workflow: code, test, build, deploy, observe</title><style>@keyframes packets{to{stroke-dashoffset:-250}}.packets{animation:packets 5s linear infinite}.stage{opacity:.15;animation:stage 7s ease-in-out infinite}@keyframes stage{0%,30%,100%{opacity:.15}12%{opacity:1}}</style><rect x="1" y="1" width="598" height="233" rx="18" fill="#0b111b" stroke="#29374a"/><text x="30" y="35" fill="#99aabe" font-family="Consolas,monospace" font-size="14" letter-spacing="2">THE ENGINEERING LOOP</text><path d="M54 115H546" fill="none" stroke="#2b4054" stroke-width="2"/><path d="M54 115H546" fill="none" stroke="#5ee7f7" stroke-width="3" stroke-dasharray="35 90" class="packets"/><circle cx="54" cy="115" r="22" fill="#132332" stroke="#304e63"/><circle cx="54" cy="115" r="27" fill="none" stroke="#5ee7f7" stroke-width="2" class="stage" style="animation-delay:0.0s"/><text x="54" y="121" text-anchor="middle" fill="#5ee7f7" font-family="Consolas,monospace" font-size="18">01</text><text x="54" y="166" text-anchor="middle" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">CODE</text><circle cx="177" cy="115" r="22" fill="#132332" stroke="#304e63"/><circle cx="177" cy="115" r="27" fill="none" stroke="#c5f277" stroke-width="2" class="stage" style="animation-delay:1.4s"/><text x="177" y="121" text-anchor="middle" fill="#c5f277" font-family="Consolas,monospace" font-size="18">02</text><text x="177" y="166" text-anchor="middle" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">TEST</text><circle cx="300" cy="115" r="22" fill="#132332" stroke="#304e63"/><circle cx="300" cy="115" r="27" fill="none" stroke="#ffb77a" stroke-width="2" class="stage" style="animation-delay:2.8s"/><text x="300" y="121" text-anchor="middle" fill="#ffb77a" font-family="Consolas,monospace" font-size="18">03</text><text x="300" y="166" text-anchor="middle" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">BUILD</text><circle cx="423" cy="115" r="22" fill="#132332" stroke="#304e63"/><circle cx="423" cy="115" r="27" fill="none" stroke="#5ee7f7" stroke-width="2" class="stage" style="animation-delay:4.199999999999999s"/><text x="423" y="121" text-anchor="middle" fill="#5ee7f7" font-family="Consolas,monospace" font-size="18">04</text><text x="423" y="166" text-anchor="middle" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">DEPLOY</text><circle cx="546" cy="115" r="22" fill="#132332" stroke="#304e63"/><circle cx="546" cy="115" r="27" fill="none" stroke="#c5f277" stroke-width="2" class="stage" style="animation-delay:5.6s"/><text x="546" y="121" text-anchor="middle" fill="#c5f277" font-family="Consolas,monospace" font-size="18">05</text><text x="546" y="166" text-anchor="middle" fill="#e6edf3" font-family="Consolas,monospace" font-size="15">OBSERVE</text></svg>