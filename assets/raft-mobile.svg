<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150" viewBox="0 0 280 150" role="img" aria-label="raft-mobile.svg">
<title>raft-mobile.svg</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#233145" stroke-width="0.6"/></pattern><linearGradient id="edge"><stop stop-color="#5ee7f7"/><stop offset="1" stop-color="#c5f277"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.flow{stroke-dasharray:8 18;animation:flow 5s linear infinite}.orbit{transform-origin:960px 220px;animation:orbit 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.3s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.signal{animation:signal 6s linear infinite}.rail{stroke-dasharray:32 1080;animation:rail 8s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.reverse-orbit{transform-origin:960px 220px;animation:orbit 23s linear infinite reverse}.meter{transform-box:fill-box;transform-origin:center bottom;animation:meter 2.4s ease-in-out infinite alternate}
@keyframes signal{from{transform:translateX(0)}to{transform:translateX(520px)}}
@keyframes rail{to{stroke-dashoffset:-1112}}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes meter{from{transform:scaleY(.28)}to{transform:scaleY(1)}}
.card-track{animation:cardtrack 5.4s linear infinite}@keyframes cardtrack{to{stroke-dashoffset:-304}}</style>
<rect width="280" height="150" rx="20" fill="#0b111b"/><rect x="1" y="1" width="278" height="148" rx="19" fill="none" stroke="#29374a"/><path d="M16 1H264" stroke="#c5f277" stroke-width="3"/><text x="16" y="34" fill="#c5f277" class="mono" font-size="16">PROJECT / 02</text><text x="16" y="79" fill="#f1f5f9" font-size="28" font-weight="650">Distributed</text><text x="16" y="114" fill="#f1f5f9" font-size="28" font-weight="650">payments</text><path d="M20 136H260" stroke="#273848" stroke-width="2"/><path d="M20 136H260" stroke="#c5f277" stroke-width="2" stroke-dasharray="24 280" class="card-track" style="animation-delay:-0.85s"/><circle cx="254" cy="114" r="3" fill="#c5f277" class="breathe" style="animation-delay:-0.85s"/></svg>