<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img"><title>Animated developer workspace with a floating robot, scrolling code and cloud servers</title><defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6f3f3"/><stop offset="1" stop-color="#73a5b6"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183645"/><stop offset="1" stop-color="#0d1b29"/></linearGradient><radialGradient id="halo"><stop stop-color="#164753" stop-opacity=".65"/><stop offset="1" stop-color="#0b111b" stop-opacity="0"/></radialGradient><clipPath id="screenclip"><rect x="116" y="164" width="375" height="148"/></clipPath><clipPath id="typingclip"><rect x="116" y="327" width="280" height="30" class="typing"/></clipPath></defs><style>
text{font-family:Consolas,'Courier New',monospace}.float{animation:float 4s ease-in-out infinite}.cloud{animation:float 6s ease-in-out infinite reverse}.shadow{transform-origin:700px 445px;animation:shadow 4s ease-in-out infinite}.eyes{transform-origin:0 188px;animation:blink 6s infinite}.pupils{animation:look 8s ease-in-out infinite}.wave{transform-origin:773px 283px;animation:wave 5s ease-in-out infinite}.typearm{transform-origin:625px 283px;animation:typearm 1.3s ease-in-out infinite alternate}.code{animation:scroll 12s linear infinite}.fan{transform-origin:991px 363px;animation:spin 8s linear infinite}.packet{animation:packet 5s linear infinite}.packet2{animation:packet 5s -2.5s linear infinite}.cursor{animation:cursor 1.2s steps(2,end) infinite}.glow{animation:glow 3s ease-in-out infinite alternate}.typing{animation:typing 4s steps(24,end) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-19px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.4}50%{transform:scaleX(.7);opacity:.2}}
@keyframes blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.09)}}
@keyframes look{0%,20%,100%{transform:translateX(0)}30%,55%{transform:translateX(-8px)}70%,85%{transform:translateX(7px)}}
@keyframes wave{0%,30%,100%{transform:rotate(0)}45%,65%{transform:rotate(-25deg)}55%,75%{transform:rotate(-8deg)}}
@keyframes typearm{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes scroll{to{transform:translateY(-168px)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes packet{0%{transform:translate(824px,209px);opacity:0}5%{opacity:1}45%{transform:translate(954px,209px)}65%{transform:translate(954px,267px)}95%{transform:translate(1023px,267px);opacity:1}100%{transform:translate(1023px,267px);opacity:0}}
@keyframes cursor{50%{opacity:0}}@keyframes glow{from{opacity:.35}to{opacity:1}}
@keyframes typing{0%,10%{width:0}70%,90%{width:280px}100%{width:0}}
