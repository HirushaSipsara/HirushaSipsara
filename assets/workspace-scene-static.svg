text x="116" y="520" font-size="15" fill="#5ee7f7">const engineer = {</text><text x="116" y="544" font-size="15" fill="#b9cad9">  name: &quot;Hirusha&quot;,</text><text x="116" y="568" font-size="15" fill="#c5f277">  focus: [&quot;software&quot;, &quot;cloud&quot;],</text><text x="116" y="592" font-size="15" fill="#b9cad9">  build: () =&gt; solveProblems(),</text><text x="116" y="616" font-size="15" fill="#ffb77a">  ship: () =&gt; automate(),</text><text x="116" y="640" font-size="15" fill="#b9cad9">  learn: () =&gt; keepGoing()</text><text x="116" y="664" font-size="15" fill="#5ee7f7">};</text></g></g><path d="M110 318H495" stroke="#233b4f"/><g clip-path="url(#typingclip)"><text x="116" y="345" font-size="15" fill="#c5f277">$ build / test / deploy</text></g><rect x="292" y="373" width="24" height="30" fill="#38546a"/><path d="M244 405Q305 388 365 405" stroke="#67869a" stroke-width="8" stroke-linecap="round"/><path d="M107 418H491L514 440H86Z" fill="#243b4d" stroke="#52768a"/><path d="M128 426H467M145 433H450" stroke="#7facc0" stroke-dasharray="12 5" stroke-width="3"/><path d="M55 448H1100" stroke="#516b7d" stroke-width="4" stroke-linecap="round"/><path d="M135 450L117 493M1010 450L1028 493" stroke="#2b4154" stroke-width="8"/><ellipse cx="559" cy="436" rx="29" ry="5" fill="#172d3c"/><path d="M541 402H570V432Q556 443 541 432Z" fill="#ffb77a"/><path d="M570 407Q591 403 582 423H570" fill="none" stroke="#ffb77a" stroke-width="5"/><path d="M548 391Q539 381 549 370M561 392Q551 379 562 368" fill="none" stroke="#95adbb" stroke-width="2" opacity=".5" class="cloud"/><g class="cloud"><path d="M924 143C894 143 885 104 911 90C902 54 952 39 973 67C997 48 1028 70 1027 91C1062 88 1075 137 1041 144Z" fill="url(#glass)" stroke="#5ee7f7" stroke-width="2"/><path d="M961 117V85M949 97L961 85L973 97" fill="none" stroke="#c5f277" stroke-width="4" stroke-linecap="round"/><text x="986" y="123" fill="#8db4c6" font-size="13">CLOUD</text></g>
