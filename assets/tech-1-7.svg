<svg xmlns="http://www.w3.org/2000/svg" width="76" height="34" viewBox="0 0 76 34" role="img" aria-label="tech-1-7.svg">
<title>tech-1-7.svg</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#233145" stroke-width="0.6"/></pattern><linearGradient id="edge"><stop stop-color="#5ee7f7"/><stop offset="1" stop-color="#c5f277"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}.flow{stroke-dasharray:8 18;animation:flow 5s linear infinite}.orbit{transform-origin:960px 220px;animation:orbit 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.cursor{animation:pulse 1.3s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-208}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.signal{animation:signal 6s linear infinite}.rail{stroke-dasharray:32 1080;animation:rail 8s linear infinite}.breathe{animation:breathe 5s ease-in-out infinite}.reverse-orbit{transform-origin:960px 220px;animation:orbit 23s linear infinite reverse}.meter{transform-box:fill-box;transform-origin:center bottom;animation:meter 2.4s ease-in-out infinite alternate}
@keyframes signal{from{transform:translateX(0)}to{transform:translateX(520px)}}
@keyframes rail{to{stroke-dashoffset:-1112}}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes meter{from{transform:scaleY(.28)}to{transform:scaleY(1)}}
.badge-ray{animation:badgeray 7s linear infinite}@keyframes badgeray{to{stroke-dashoffset:-88}}</style>
<rect width="76" height="34" rx="20" fill="#0b111b"/><rect x="1" y="1" width="74" height="32" rx="19" fill="none" stroke="#29374a"/><rect x="1" y="1" width="74" height="32" rx="8" fill="#142030" stroke="#304155"/><text x="38.0" y="22" text-anchor="middle" fill="#c5f277" class="mono" font-size="14">MySQL</text><path d="M10 31H66" stroke="#c5f277" stroke-width="1.5" stroke-dasharray="12 76" class="badge-ray" style="animation-delay:-6.24s"/></svg>